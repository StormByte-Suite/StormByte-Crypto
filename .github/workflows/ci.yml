name: CI

permissions:
  actions: write
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ###########################################################################
  # Bootstraps
  # Submodule cache is OS-scoped by Actions — one warm job per OS.
  ###########################################################################
  checkout-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: checkout-bootstrap (${{ matrix.os }})
    steps:
      - name: Warm submodule / checkout cache
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

  apt-bootstrap:
    runs-on: ubuntu-latest
    name: apt-bootstrap
    steps:
      - name: Warm APT lists cache
        uses: stormbytepp/githubactions/.github/actions/update-apt-cached@master
        with:
          cache-key: apt-lists

  ###########################################################################
  # Linux
  ###########################################################################
  build-linux:
    needs: [checkout-bootstrap, apt-bootstrap]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, clang-libc++]
    name: linux-${{ matrix.compiler }}
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install OpenSSL (CLI for KeyPair fixtures)
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: "openssl"
          cache-key: apt-openssl-v1
          lists-cache-key: apt-lists
          rotate-weekly: true

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          # Append. Assigning the variable would drop a path already set.
          add_dir() {
            local name="$1" dir="$2"
            local current="${!name-}"
            case ":${current}:" in
              *":${dir}:"*) return 0 ;;
            esac
            if [[ -n "$current" ]]; then
              export "${name}=${current}:${dir}"
            else
              export "${name}=${dir}"
            fi
            echo "${name}=${!name}" >> "$GITHUB_ENV"
          }
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            add_dir "$name" "${{ github.workspace }}/build/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib64"
          done

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1-release-${{ matrix.compiler }}
          buildmaster-datadir-cache-key: bm-datadir-${{ runner.os }}-${{ matrix.compiler }}
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_LTO=ON
            -DENABLE_PGO=OFF
            -DENABLE_TEST=ON
            -DWITH_CRYPTOPP=BUNDLED
            -DWITH_BZIP2=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DBUILD_SHARED_LIBS=ON
            ${{ matrix.compiler == 'clang-libc++' && '-DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_CXX_STANDARD_LIBRARIES=-stdlib=libc++' || '' }}
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  ###########################################################################
  # macOS
  ###########################################################################
  build-macos:
    needs: [checkout-bootstrap]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang]
    name: macos-${{ matrix.compiler }}
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install OpenSSL (Homebrew via install-cached)
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: "openssl@3"

      - name: Put Homebrew OpenSSL on PATH
        run: |
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          openssl version

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          # Append. Assigning the variable would drop a path already set.
          add_dir() {
            local name="$1" dir="$2"
            local current="${!name-}"
            case ":${current}:" in
              *":${dir}:"*) return 0 ;;
            esac
            if [[ -n "$current" ]]; then
              export "${name}=${current}:${dir}"
            else
              export "${name}=${dir}"
            fi
            echo "${name}=${!name}" >> "$GITHUB_ENV"
          }
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            add_dir "$name" "${{ github.workspace }}/build/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib64"
          done

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1-release-${{ matrix.compiler }}
          buildmaster-datadir-cache-key: bm-datadir-${{ runner.os }}-${{ matrix.compiler }}
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_LTO=ON
            -DENABLE_PGO=OFF
            -DENABLE_TEST=ON
            -DWITH_CRYPTOPP=BUNDLED
            -DWITH_BZIP2=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  ###########################################################################
  # Windows (must build with MSVC in C++23 until CryptoPP accepts clang-cl)
  ###########################################################################
  build-windows:
    needs: [checkout-bootstrap]
    runs-on: windows-latest
    name: windows-msvc

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install OpenSSL (direct from slproweb)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Light is enough for the openssl CLI in tests
          $candidates = @(
            "https://slproweb.com/download/Win64OpenSSL_Light-4_0_3.exe",
            "https://slproweb.com/download/Win64OpenSSL_Light-4_0_3.msi",
            "https://slproweb.com/download/Win64OpenSSL_Light-3_5_9.exe",
            "https://slproweb.com/download/Win64OpenSSL_Light-3_5_8.exe",
            "https://slproweb.com/download/Win64OpenSSL_Light-3_5_7.exe",
            "https://slproweb.com/download/Win64OpenSSL_Light-3_5_4.exe"
          )

          $installer = Join-Path $env:RUNNER_TEMP "openssl-setup"
          $url = $null
          foreach ($c in $candidates) {
            try {
              $r = Invoke-WebRequest -Uri $c -Method Head -UseBasicParsing -TimeoutSec 30
              if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 400) {
                $url = $c
                break
              }
            } catch {
              Write-Host "skip (not available): $c"
            }
          }

          if (-not $url) {
            throw "No working OpenSSL installer URL found on slproweb (catalog lag / 404)."
          }

          Write-Host "Downloading: $url"
          $ext = [IO.Path]::GetExtension(([Uri]$url).AbsolutePath)
          $out = "$installer$ext"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing

          if ($ext -eq ".msi") {
            Start-Process msiexec.exe -ArgumentList @("/i", $out, "/qn", "/norestart") -Wait -NoNewWindow
          } else {
            Start-Process -FilePath $out -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -NoNewWindow
          }

          foreach ($p in @(
            "${env:ProgramFiles}\OpenSSL-Win64\bin",
            "${env:ProgramFiles}\OpenSSL\bin",
            "${env:ProgramFiles(x86)}\OpenSSL-Win64\bin"
          )) {
            if (Test-Path $p) {
              $p | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "PATH += $p"
            }
          }

          # refresh PATH in this step
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" +
                      [System.Environment]::GetEnvironmentVariable("Path","User")
          openssl version

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: msvc
          ccache-key: v1-release-msvc
          buildmaster-datadir-cache-key: bm-datadir-${{ runner.os }}-msvc
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_LTO=ON
            -DENABLE_PGO=OFF
            -DENABLE_TEST=ON
            -DWITH_CRYPTOPP=BUNDLED
            -DWITH_BZIP2=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test
